<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask - Second Brain</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="/static/script.js"></script>
</head>

<body>
    <main>
        {% include "nav.html" %}

        <div class="chat-top">
            <h1>Ask your brain</h1>
            <button class="secondary" hx-post="/clear" hx-target="#chat" hx-swap="innerHTML"
                hx-confirm="Clear this chat?">Clear chat</button>
        </div>

        <div id="chat">
            {% for m in history %}{% include "bubble.html" %}{% endfor %}
        </div>
        <div id="thinking" class="htmx-indicator">Thinking...</div>

        <form class="chat-form" hx-post="/ask" hx-target="#chat" hx-swap="beforeend" hx-indicator="#thinking"
            hx-disabled-elt="find button" hx-on::before-request="addUserBubble(this)">
            <input type="text" name="question" placeholder="Ask your doubt..." autocomplete="off" required autofocus>
            <button type="submit">Send</button>
        </form>
    </main>
</body>

</html>
