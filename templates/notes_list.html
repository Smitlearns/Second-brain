{% for note in notes %}
<article class="card">
    <h2>{{ note.title }}</h2>
    <p>{{ note.body }}</p>
    <small>{{ note.created_at }}</small>
    <button class="delete" hx-post="/delete/{{ note.id }}" hx-target="closest article" hx-swap="outerHTML"
        hx-confirm="Delete this note?">Delete</button>
</article>
{% else %}
<p class="empty">No notes found.</p>
{% endfor %}
